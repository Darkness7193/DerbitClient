services:

  app:
    build: .
    ports:
      - '8000:8000'
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: pyproject.toml

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  beat:
    build: .
    command: ["uv", "run", "celery", "-A", "src.celery_app:celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - rabbitmq

  worker:
    build: .
    command: ["uv", "run", "celery", "-A", "src.celery_app", "worker", "--loglevel=info"]
    env_file:
    - .env
    depends_on:
    - rabbitmq
    - db
    restart: unless-stopped

volumes:
  db_data: